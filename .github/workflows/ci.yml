name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Offline re-check of the KAN-3 example
        run: node bin/recheck.js --checks examples/kan-3/checks.json --receipt examples/kan-3/receipt.json --comment examples/kan-3/comment.json --expect 27fd3721d96b196d78743a558343813107f9d75c6c146ad584730750599c5091
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Secret scan of the full history
        run: '"$RUNNER_TEMP/gitleaks" git --verbose --redact .'
